<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>跳一跳</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;height:100dvh;overflow:hidden;font-family:'PingFang SC','Microsoft YaHei',sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#game{position:relative;width:100vw;max-width:480px;height:100dvh;overflow:hidden;background:linear-gradient(180deg,#f8e8e0 0%,#f0d4c8 30%,#e8c8b8 60%,#d4b8a8 100%)}
canvas{display:block;width:100%;height:100%}
#ui{position:absolute;top:0;left:0;right:0;pointer-events:none}
#score{position:absolute;top:50px;left:50%;transform:translateX(-50%);font-size:52px;font-weight:900;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.25);transition:transform .12s}
#score.pop{transform:translateX(-50%) scale(1.25)}
#combo{position:absolute;top:110px;left:50%;transform:translateX(-50%) translateY(10px);font-size:18px;font-weight:700;color:#ff6b00;opacity:0;transition:opacity .2s,transform .2s;text-shadow:0 1px 3px rgba(0,0,0,.2)}
#combo.show{opacity:1;transform:translateX(-50%) translateY(0)}
#hint{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);color:rgba(0,0,0,.35);font-size:14px;font-weight:500;transition:opacity .4s}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .4s}
#overlay.show{opacity:1;pointer-events:auto}
#overlay .card{background:#fff;border-radius:24px;padding:36px 28px 24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);width:300px;max-width:90vw}
#overlay .title{font-size:13px;color:#999;margin-bottom:4px}
#overlay .final{font-size:68px;font-weight:900;color:#1a1a2e;line-height:1}
#overlay .stats{display:flex;justify-content:center;gap:28px;margin:12px 0 16px;font-size:13px;color:#888}
#overlay .stats b{display:block;font-size:20px;color:#333}
#overlay .rank{font-size:22px;font-weight:800;color:#ff6b00;margin-bottom:4px}
#overlay .rank-sub{font-size:13px;color:#999;margin-bottom:16px}
#overlay .btn{display:block;width:100%;padding:13px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:8px;transition:transform .1s}
#overlay .btn:active{transform:scale(.96)}
#overlay .btn-r{background:#1a1a2e;color:#fff}
#overlay .btn-s{background:#07c160;color:#fff}
#toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 22px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>
  <div id="ui">
    <div id="score">0</div>
    <div id="combo">完美!</div>
    <div id="hint">按住蓄力，松手起跳</div>
    <div id="overlay">
      <div class="card">
        <div class="title">得分</div>
        <div class="final" id="finalscore">0</div>
        <div class="stats"><span>完美着陆<b id="stat-perfect">0</b></span><span>最大连击<b id="stat-combo">0</b></span></div>
        <div class="rank" id="rank-title"></div>
        <div class="rank-sub" id="rank-sub"></div>
        <button class="btn btn-r" id="btn-restart">再来一局</button>
        <button class="btn btn-s" id="btn-share">分享给朋友</button>
      </div>
    </div>
    <div id="toast">链接已复制</div>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const gameEl = document.getElementById('game');
  const scoreEl = document.getElementById('score');
  const comboEl = document.getElementById('combo');
  const hintEl = document.getElementById('hint');
  const overlay = document.getElementById('overlay');
  const finalScoreEl = document.getElementById('finalscore');
  const statPerfectEl = document.getElementById('stat-perfect');
  const statComboEl = document.getElementById('stat-combo');
  const rankTitleEl = document.getElementById('rank-title');
  const rankSubEl = document.getElementById('rank-sub');
  const toast = document.getElementById('toast');

  let W, H, dpr;
  function resize() {
    const r = gameEl.getBoundingClientRect();
    W = r.width; H = r.height;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ─── Audio ───
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let ac;
  function a() { if (!ac) ac = new AudioCtx(); return ac; }
  function tone(f, d, t = 'sine', v = 0.1, r = true) {
    try { const c = a(); const o = c.createOscillator(); const g = c.createGain();
      const now = c.currentTime; o.type = t; o.frequency.setValueAtTime(f, now);
      g.gain.setValueAtTime(v, now); if (r) g.gain.exponentialRampToValueAtTime(0.001, now + d);
      o.connect(g); g.connect(c.destination); o.start(now); o.stop(now + d); } catch (_) {}
  }
  function sfxChg() { tone(220, 0.25, 'sine', 0.06); }
  function sfxJump() { tone(380, 0.12, 'triangle', 0.1); }
  function sfxLand() { tone(520, 0.08, 'sine', 0.08); }
  function sfxPerfect() { tone(880, 0.08, 'sine', 0.1); setTimeout(() => tone(1100, 0.1, 'sine', 0.1), 70); }
  function sfxCombo(n) { const f = 500 + n * 80; tone(f, 0.08, 'sine', 0.08); setTimeout(() => tone(f * 1.25, 0.08, 'sine', 0.08), 60); }
  function sfxMissile() { tone(150, 0.4, 'sawtooth', 0.08); setTimeout(() => tone(100, 0.6, 'sawtooth', 0.06), 200); }
  function sfxGameOver() { tone(250, 0.2, 'sawtooth', 0.06); setTimeout(() => tone(150, 0.35, 'sawtooth', 0.06), 150); }

  // ─── Constants ───
  const BLOCK_W = 72, BLOCK_D = 72, BLOCK_H = 48;
  const CHAR_R = 14;
  const ISO_COS = 0.866, ISO_SIN = 0.5; // cos30, sin30
  const MAX_POWER = 1000;
  const MISSILE_POWER = 1100;
  const GRAVITY = 2800;

  // ─── State ───
  let platforms = [];
  let char = { wx: 0, wy: 0, wz: 0, vx: 0, vy: 0, vz: 0, onGround: true, squish: 0, rot: 0 };
  let camera = { x: 0, y: 0 };
  let score = 0, combo = 0, bestScore = 0, perfectCount = 0, maxCombo = 0;
  let charging = false, chargeStart = 0, jumping = false, dead = false, started = false, missile = false, missileTime = 0;
  let particles = [];
  let curIdx = 0;
  let shakeX = 0, shakeY = 0;
  const EMOJIS = ['🎵','🎮','🌟','💎','🎯','⭐','🍀','🎪','🎨','🌈','🦊','🐱','🐶','🌻'];

  try { bestScore = parseInt(localStorage.getItem('jj_best')) || 0; } catch (_) {}

  // ─── Projection ───
  function iso(wx, wy, wz) {
    return {
      x: (wx - wy) * ISO_COS,
      y: (wx + wy) * ISO_SIN - wz
    };
  }

  // ─── Platforms ───
  function newPlatform(prev, dir) {
    const gap = 100 + Math.random() * 160;
    let wx = prev.wx, wy = prev.wy;
    if (dir === 'x') wx += gap * (Math.random() > 0.5 ? 1 : -1);
    else wy += gap * (Math.random() > 0.5 ? 1 : -1);
    const colors = ['#ffd93d','#6bcb77','#4d96ff','#ff6b6b','#c084fc','#fb923c','#f472b6','#34d399','#a78bfa'];
    return {
      wx, wy, wz: 0,
      w: BLOCK_W, d: BLOCK_D, h: BLOCK_H,
      color: colors[Math.floor(Math.random() * colors.length)],
      emoji: EMOJIS[Math.floor(Math.random() * EMOJIS.length)]
    };
  }

  function init() {
    platforms = [{
      wx: 0, wy: 0, wz: 0, w: BLOCK_W, d: BLOCK_D, h: BLOCK_H,
      color: '#e8e8e8', emoji: '🏁'
    }];
    platforms.push(newPlatform(platforms[0], 'x'));
    platforms.push(newPlatform(platforms[1], 'y'));
    platforms.push(newPlatform(platforms[2], 'x'));
    platforms.push(newPlatform(platforms[3], 'y'));
  }

  function resetChar() {
    const p = platforms[0];
    char.wx = p.wx; char.wy = p.wy; char.wz = p.h;
    char.vx = 0; char.vy = 0; char.vz = 0;
    char.onGround = true; char.squish = 0; char.rot = 0;
    curIdx = 0;
    camera.x = p.wx; camera.y = p.wy;
    missile = false; missileTime = 0;
  }

  function reset() {
    dead = false; started = false; charging = false; jumping = false; missile = false; missileTime = 0;
    score = 0; combo = 0; perfectCount = 0; maxCombo = 0;
    particles = []; shakeX = 0; shakeY = 0;
    scoreEl.textContent = '0';
    comboEl.classList.remove('show');
    overlay.classList.remove('show');
    hintEl.style.opacity = '1';
    init();
    resetChar();
  }

  // ─── Particles ───
  function emit(wx, wy, wz, color, n = 10) {
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = 60 + Math.random() * 180;
      particles.push({
        wx, wy, wz,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        vz: 100 + Math.random() * 200,
        life: 0.4 + Math.random() * 0.5, age: 0,
        size: 2 + Math.random() * 3, color
      });
    }
  }

  function emitFlame(wx, wy, wz) {
    for (let i = 0; i < 3; i++) {
      particles.push({
        wx: wx + (Math.random() - 0.5) * 10,
        wy: wy + (Math.random() - 0.5) * 10,
        wz: wz - 10,
        vx: (Math.random() - 0.5) * 40,
        vy: (Math.random() - 0.5) * 40,
        vz: -60 - Math.random() * 120,
        life: 0.2 + Math.random() * 0.3, age: 0,
        size: 3 + Math.random() * 5,
        color: Math.random() > 0.5 ? '#ff6b35' : '#ffd700'
      });
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.wx += p.vx * dt; p.wy += p.vy * dt; p.wz += p.vz * dt;
      p.vz -= 500 * dt;
      p.age += dt;
      if (p.age >= p.life) particles.splice(i, 1);
    }
  }

  // ─── Input ───
  function down(e) {
    if (dead || jumping) return;
    e.preventDefault();
    a();
    if (!started) { started = true; hintEl.style.opacity = '0'; }
    charging = true;
    chargeStart = performance.now();
    sfxChg();
  }
  function up(e) {
    if (!charging || dead) return;
    e.preventDefault();
    charging = false;
    const power = Math.min(MISSILE_POWER + 50, (performance.now() - chargeStart) / 1000 * 750);
    char.squish = 0;

    if (power > MISSILE_POWER) {
      // Missile mode!
      missile = true;
      missileTime = 0;
      const next = platforms[curIdx + 1];
      const dx = next.wx - char.wx, dy = next.wy - char.wy;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      char.vx = (dx / d) * 500;
      char.vy = (dy / d) * 500;
      char.vz = -2000;
      char.onGround = false;
      jumping = true;
      sfxMissile();
      shakeX = 14; shakeY = 14;
    } else {
      missile = false;
      const next = platforms[curIdx + 1];
      const dx = next.wx - char.wx, dy = next.wy - char.wy;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      char.vx = (dx / d) * power;
      char.vy = (dy / d) * power;
      char.vz = -power * 0.7;
      char.onGround = false;
      jumping = true;
      sfxJump();
    }
  }

  gameEl.addEventListener('mousedown', down);
  gameEl.addEventListener('mouseup', up);
  gameEl.addEventListener('mouseleave', up);
  gameEl.addEventListener('touchstart', down, { passive: false });
  gameEl.addEventListener('touchend', up);
  gameEl.addEventListener('touchcancel', up);

  document.getElementById('btn-restart').addEventListener('click', e => { e.stopPropagation(); reset(); });
  document.getElementById('btn-share').addEventListener('click', e => {
    e.stopPropagation();
    navigator.clipboard.writeText(location.href).then(() => {
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1500);
    }).catch(() => {
      toast.textContent = '复制失败，请手动复制链接';
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); toast.textContent = '链接已复制'; }, 1500);
    });
  });

  // ─── Update ───
  function update(dt) {
    if (dead) return;
    dt = Math.min(dt, 0.1);

    // Charging squish
    if (charging) {
      char.squish = Math.min(0.55, (performance.now() - chargeStart) / 1000 * 2);
    } else if (!jumping) {
      char.squish += (0 - char.squish) * 12 * dt;
    }

    // Physics
    if (!char.onGround) {
      char.wx += char.vx * dt;
      char.wy += char.vy * dt;
      char.vz += GRAVITY * dt;
      char.wz += char.vz * dt;
      char.rot += char.vx * 0.015 * dt;

      // Missile flight
      if (missile) {
        missileTime += dt;
        emitFlame(char.wx, char.wy, char.wz);
        if (missileTime > 2.5) { endGame(); return; }
      }

      // Landing check (skip if missile)
      if (!missile) {
        const nextIdx = curIdx + 1;
        if (nextIdx < platforms.length) {
          const p = platforms[nextIdx];
          const topZ = p.wz + p.h;
          if (char.wz <= topZ && char.vz > 0) {
            const dx = Math.abs(char.wx - p.wx);
            const dy = Math.abs(char.wy - p.wy);
            const hw = p.w / 2 + CHAR_R * 0.8;
            const hd = p.d / 2 + CHAR_R * 0.8;
            if (dx < hw && dy < hd) {
              char.wz = topZ;
              char.vx = 0; char.vy = 0; char.vz = 0;
              char.onGround = true; jumping = false;
              char.wx = p.wx; char.wy = p.wy;
              curIdx = nextIdx;
              score++;
              scoreEl.textContent = score;
              scoreEl.classList.add('pop');
              setTimeout(() => scoreEl.classList.remove('pop'), 140);

              const centerDist = Math.sqrt(dx * dx + dy * dy);
              const perfectThreshold = p.w * 0.15;
              if (centerDist < perfectThreshold) {
                combo++;
                perfectCount++;
                if (combo > maxCombo) maxCombo = combo;
                score += combo;
                scoreEl.textContent = score;
                sfxPerfect();
                emit(char.wx, char.wy, char.wz, '#ffd700', 18);
                comboEl.textContent = combo >= 6 ? '太棒了!' : combo >= 3 ? '连击!' : '完美!';
                comboEl.classList.add('show');
                clearTimeout(comboEl._t);
                comboEl._t = setTimeout(() => comboEl.classList.remove('show'), 700);
                if (combo >= 2) sfxCombo(combo);
              } else {
                combo = 0;
                sfxLand();
                emit(char.wx, char.wy, char.wz, p.color, 8);
              }
              shakeX = 2; shakeY = 2;

              if (platforms.length < curIdx + 4) {
                const dir = platforms.length % 2 === 0 ? 'x' : 'y';
                platforms.push(newPlatform(platforms[platforms.length - 1], dir));
              }
              while (platforms.length > 8) { platforms.shift(); curIdx--; }
            }
          }
        }
      }

      // Fall off
      if (char.wz < -H) {
        endGame();
      }
    }

    // Camera
    const next = platforms[Math.min(curIdx + 1, platforms.length - 1)];
    const tx = char.wx + (next.wx - char.wx) * 0.35;
    const ty = char.wy + (next.wy - char.wy) * 0.35;
    camera.x += (tx - camera.x) * 4 * dt;
    camera.y += (ty - camera.y) * 4 * dt;

    // Shake
    shakeX += (0 - shakeX) * 8 * dt;
    shakeY += (0 - shakeY) * 8 * dt;

    updateParticles(dt);
  }

  function endGame() {
    if (dead) return;
    dead = true;
    jumping = false;
    charging = false;
    if (missile) sfxMissile();
    else sfxGameOver();
    if (score > bestScore) { bestScore = score; try { localStorage.setItem('jj_best', bestScore); } catch (_) {} }
    finalScoreEl.textContent = score;
    statPerfectEl.textContent = perfectCount;
    statComboEl.textContent = maxCombo;

    // Rank title
    if (missile) {
      const titles = [
        { min: 30, title: '🚀 人体火箭', sub: '飞了这么久才发射，你已经是专业跳跳选手了！' },
        { min: 15, title: '🔥 空中飞人', sub: '半路才想起来自己还能飞，水平不错！' },
        { min: 5, title: '🎈 起飞失败', sub: '刚热身就上天了，下次稳一点！' },
        { min: 0, title: '🎪 自爆选手', sub: '第一步就发射！你是来玩火箭的吧？' },
      ];
      const t = titles.find(t => score >= t.min) || titles[titles.length - 1];
      rankTitleEl.textContent = t.title;
      rankSubEl.textContent = t.sub;
    } else {
      if (score >= 50) { rankTitleEl.textContent = '👑 跳跳大师'; rankSubEl.textContent = '你是方块的王者！'; }
      else if (score >= 30) { rankTitleEl.textContent = '🎯 跳跃高手'; rankSubEl.textContent = '手感火热，继续加油！'; }
      else if (score >= 15) { rankTitleEl.textContent = '💪 渐入佳境'; rankSubEl.textContent = '开始找到感觉了！'; }
      else if (score >= 5) { rankTitleEl.textContent = '🐣 初出茅庐'; rankSubEl.textContent = '多练练蓄力手感~'; }
      else { rankTitleEl.textContent = '😅 继续努力'; rankSubEl.textContent = '按住蓄力，对准方块松手！'; }
    }
    overlay.classList.add('show');
  }

  // ─── Render ───
  function drawBlock(p) {
    const hw = p.w / 2, hd = p.d / 2;
    const top = iso(p.wx, p.wy, p.wz + p.h);
    const tl = iso(p.wx - hw, p.wy - hd, p.wz + p.h);
    const tr = iso(p.wx + hw, p.wy - hd, p.wz + p.h);
    const br = iso(p.wx + hw, p.wy + hd, p.wz + p.h);
    const bl = iso(p.wx - hw, p.wy + hd, p.wz + p.h);
    const btl = iso(p.wx - hw, p.wy - hd, p.wz);
    const btr = iso(p.wx + hw, p.wy - hd, p.wz);
    const bbr = iso(p.wx + hw, p.wy + hd, p.wz);
    const bbl = iso(p.wx - hw, p.wy + hd, p.wz);

    function darken(hex, amt) {
      let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
      r = Math.max(0, Math.floor(r * amt)); g = Math.max(0, Math.floor(g * amt)); b = Math.max(0, Math.floor(b * amt));
      return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
    }

    // Left face (x = bx - w/2): btl -> bbl -> bl -> tl
    ctx.fillStyle = darken(p.color, 0.65);
    ctx.beginPath(); ctx.moveTo(btl.x, btl.y); ctx.lineTo(bbl.x, bbl.y); ctx.lineTo(bl.x, bl.y); ctx.lineTo(tl.x, tl.y); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.08)'; ctx.lineWidth = 1; ctx.stroke();

    // Right face (y = by - d/2): btl -> btr -> tr -> tl
    ctx.fillStyle = darken(p.color, 0.8);
    ctx.beginPath(); ctx.moveTo(btl.x, btl.y); ctx.lineTo(btr.x, btr.y); ctx.lineTo(tr.x, tr.y); ctx.lineTo(tl.x, tl.y); ctx.closePath(); ctx.fill();
    ctx.stroke();

    // Top face
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.moveTo(tl.x, tl.y); ctx.lineTo(tr.x, tr.y); ctx.lineTo(br.x, br.y); ctx.lineTo(bl.x, bl.y); ctx.closePath(); ctx.fill();
    ctx.stroke();

    // Emoji
    ctx.fillStyle = '#000';
    ctx.font = `${Math.floor(p.w * 0.35)}px serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(p.emoji, top.x, top.y - 2);
  }

  function drawChar() {
    const s = iso(char.wx, char.wy, char.wz);
    const sqY = char.squish * CHAR_R * 0.45;
    const sqX = char.squish * CHAR_R * 0.25;

    ctx.save();
    ctx.translate(s.x, s.y + sqY);
    ctx.rotate(char.rot);

    // Shadow
    if (char.onGround) {
      ctx.fillStyle = 'rgba(0,0,0,0.12)';
      ctx.beginPath();
      ctx.ellipse(0, CHAR_R + sqY + 3, CHAR_R * 0.7, 3, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // Body
    const grad = ctx.createLinearGradient(0, -CHAR_R, 0, CHAR_R);
    grad.addColorStop(0, '#5a5a5a');
    grad.addColorStop(0.5, '#333');
    grad.addColorStop(1, '#1a1a1a');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(0, 0, CHAR_R + sqX, CHAR_R - sqY, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Eyes
    const ey = -CHAR_R * 0.15;
    const ex = CHAR_R * 0.3;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-ex, ey, 4.5, 0, Math.PI * 2); ctx.arc(ex, ey, 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(-ex, ey, 2.2, 0, Math.PI * 2); ctx.arc(ex, ey, 2.2, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Background gradient is handled by CSS

    const camIso = iso(camera.x, camera.y, 0);
    const cx = W / 2 - camIso.x + (Math.random() - 0.5) * shakeX * 2;
    const cy = H * 0.55 - camIso.y + (Math.random() - 0.5) * shakeY * 2;

    ctx.save();
    ctx.translate(cx, cy);

    // Draw platforms (sorted by position for correct occlusion)
    const sorted = platforms.map((p, i) => ({ p, i })).sort((a, b) => {
      const sa = iso(a.p.wx, a.p.wy, 0);
      const sb = iso(b.p.wx, b.p.wy, 0);
      return sa.y - sb.y;
    });
    for (const { p } of sorted) drawBlock(p);

    // Particles
    for (const p of particles) {
      const s = iso(p.wx, p.wy, p.wz);
      const alpha = 1 - p.age / p.life;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(s.x, s.y, p.size * alpha, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Character
    drawChar();

    // Power bar
    if (charging) {
      const power = Math.min(1, (performance.now() - chargeStart) / 1000 * 750 / MAX_POWER);
      const over = (performance.now() - chargeStart) / 1000 * 750 > MISSILE_POWER;
      const charS = iso(char.wx, char.wy, char.wz);
      const bw = 100, bh = 7;
      const bx = charS.x - bw / 2, by = charS.y - CHAR_R - 28;

      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, bh, 3.5);
      ctx.fill();

      const grad = ctx.createLinearGradient(bx, 0, bx + bw, 0);
      grad.addColorStop(0, '#4d96ff');
      grad.addColorStop(0.5, '#6bcb77');
      grad.addColorStop(1, '#ff6b6b');
      ctx.fillStyle = over ? '#ff4444' : grad;
      ctx.beginPath();
      ctx.roundRect(bx, by, bw * Math.min(1, power), bh, 3.5);
      ctx.fill();

      // Missile indicator
      if (over) {
        ctx.fillStyle = '#ff6b35';
        ctx.font = 'bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('🚀', charS.x, by - 14);
      }
    }

    ctx.restore();
  }

  // ─── Loop ───
  let last = 0;
  function loop(t) {
    const dt = last ? Math.min((t - last) / 1000, 0.1) : 0.016;
    last = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  init();
  resetChar();
  requestAnimationFrame(loop);
})();
</script>
</body>
